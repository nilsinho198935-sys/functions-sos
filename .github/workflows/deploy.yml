name: Deploy Firebase Functions

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Check secret
        run: |
          if [ -z "${{ secrets.GOOGLE_CREDENTIALS }}" ]; then
            echo "SECRET VAZIO"
          else
            echo "SECRET TEM CONTEUDO"
          fi
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: cd functions && npm install
      - uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --project maodeobra-7dafe
        env:
          GCP_SA_KEY: ${{ secrets.GOOGLE_CREDENTIALS }}
